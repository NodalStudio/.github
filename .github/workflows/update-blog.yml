name: Update blog section

# Refreshes the "From the blog" section of the organisation profile from
# nodalstudio.io: latest articles, posters and topic counts.
on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [blog-published] # can be sent by the website after a deploy
  push:
    branches: [main]
    paths:
      - scripts/update_blog.py
      - .github/workflows/update-blog.yml

permissions:
  contents: write

concurrency:
  group: update-blog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pillow

      - name: Refresh the blog section
        run: python scripts/update_blog.py

      - name: Commit changes
        run: |
          git add profile
          if git diff --cached --quiet; then
            echo "Blog section already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh latest blog articles"
          git push

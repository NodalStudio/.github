name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. **Security issues must not be reported here** — see the security policy.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal sequence of steps, or a code sample, that reproduces the issue.
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version, tag or commit you are using.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, runtime and browser versions, if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. It is formatted as code automatically.
      render: shell
